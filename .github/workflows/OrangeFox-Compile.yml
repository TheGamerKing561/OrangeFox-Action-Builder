name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options: [14.1, 12.1, 11.0]
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/TheGamerKing561/recovery_device_lenovo_X505X-12.1-new/'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Device Tree Path'
        required: true
        default: 'device/lenovo/X505X'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'X505X'
      MAKEFILE_NAME:
        description: 'Makefile Name (excluding .mk extension, Example: twrp_codename)'
        required: true
        default: 'twrp_X505X'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options: [boot, recovery, vendorboot]
      MAINTAINER_NAME:
        description: 'Maintainer name'
        required: false
        default: ''
      APPLY_PATCHES:
        description: 'Apply custom source patches'
        type: boolean
        required: true
        default: false
      PATCHES_FOLDER:
        description: 'Name of folder containing custom source patches (must be inside the device tree)'
        required: true
        default: 'patches'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
                
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt update && sudo apt install aria2 git -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd "./${{ inputs.DEVICE_PATH }}"
        
        COMMIT_ID=$(git rev-parse HEAD)
        SHORT_COMMIT_ID=$(git rev-parse --short HEAD)
        COMMIT_TITLE=$(git log -1 --pretty=%s)
        COMMIT_DATE=$(git log -1 --date=format:%Y-%m-%d --pretty=%cd)
        
        echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
        echo "SHORT_COMMIT_ID=$SHORT_COMMIT_ID" >> $GITHUB_ENV
        echo "COMMIT_TITLE=$COMMIT_TITLE" >> $GITHUB_ENV
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV

    - name: Get OrangeFox Recovery Commit
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery

        OF_COMMIT_ID=$(git rev-parse HEAD)
        OF_SHORT_COMMIT=$(git rev-parse --short HEAD)
        OF_COMMIT_TITLE=$(git log -1 --pretty=%s)
        OF_COMMIT_DATE=$(git log -1 --date=format:%Y-%m-%d --pretty=%cd)

        echo "OF_COMMIT_ID=$OF_COMMIT_ID" >> $GITHUB_ENV
        echo "OF_SHORT_COMMIT=$OF_SHORT_COMMIT" >> $GITHUB_ENV
        echo "OF_COMMIT_TITLE=$OF_COMMIT_TITLE" >> $GITHUB_ENV
        echo "OF_COMMIT_DATE=$OF_COMMIT_DATE" >> $GITHUB_ENV

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: Apply source patches
      if: github.event.inputs.APPLY_PATCHES == 'true'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        PATCH_DIR="../../${{ inputs.DEVICE_PATH }}/${{ inputs.PATCHES_FOLDER }}"
        HAS_PATCHES="false"

        if [ -d "$PATCH_DIR" ]; then
          echo "Applying patches from $PATCH_DIR"
          for patch in $PATCH_DIR/*.patch; do
            [ -f "$patch" ] || continue
            echo "Applying $patch"
            git apply "$patch" || {
              echo "git apply failed, trying fallback..."
              git apply --reject --whitespace=fix "$patch" || exit 1
            }
            HAS_PATCHES="true"
          done
        else
          echo "Specified patches directory not found: $PATCH_DIR"
        fi

        echo "HAS_PATCHES=$HAS_PATCHES" >> $GITHUB_ENV

    - name: Set Maintainer Info
      run: |
        if [ "${{ github.actor }}" = "TheGamerKing561" && "${{ inputs.MAINTAINER_NAME }}" != "" ]; then
          echo "OF_MAINTAINER=@TheGamerKing on XDA" >> $GITHUB_ENV
        else if ["${{ inputs.MAINTAINER_NAME }}" != ""] then
          echo "OF_MAINTAINER=${{ inputs.MAINTAINER_NAME }}" >> $GITHUB_ENV
        fi
        
    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        set +e
        source build/envsetup.sh
        set -e
        
        export ALLOW_MISSING_DEPENDENCIES=true
        
        if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
          LUNCH_TARGET="${{ inputs.MAKEFILE_NAME }}-ap2a-eng"
        else
          LUNCH_TARGET="${{ inputs.MAKEFILE_NAME }}-eng"
        fi

        lunch "$LUNCH_TARGET" || { echo "Lunch failed"; exit 1; }
        
        make clean
        
        if [ -n "$OF_MAINTAINER" ]; then
          export OF_MAINTAINER
        fi
        
        mka adbd ${{ inputs.BUILD_TARGET }}image

        if [ "${{ github.actor }}" = "TheGamerKing561" ]; then
          echo "OF_MAINTAINER=TheGamerKing on XDA" >> $GITHUB_ENV
        fi

    - name: Rename Build Outputs
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}
        
        for f in OrangeFox*.img; do
          [ -e "$f" ] && mv "$f" "${f%.img}-${{ env.BUILD_DATE }}.img"
        done
        
        for f in OrangeFox*.zip; do
          [ -e "$f" ] && mv "$f" "${f%.zip}-${{ env.BUILD_DATE }}.zip"
        done

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} (${{ env.BUILD_DATE }}) (${{ env.SHORT_COMMIT_ID }})
        tag_name: ${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        body: |
          OrangeFox Branch: ${{ inputs.MANIFEST_BRANCH }}

          Device: ${{ inputs.DEVICE_NAME }}
          ${{ env.OF_MAINTAINER && format('Maintainer: {0}', env.OF_MAINTAINER) }}
          Image Build Target: ${{ inputs.BUILD_TARGET }}
          
          Device Tree Repo: [Device Tree](${{ inputs.DEVICE_TREE }})
          Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
          
          OrangeFox Recovery Commit:
          [${{ env.OF_SHORT_COMMIT }}](https://gitlab.com/OrangeFox/bootable/Recovery/-/commit/${{ env.OF_COMMIT_ID }}) - ${{ env.OF_COMMIT_TITLE }} (${{ env.OF_COMMIT_DATE }})
          ${{ env.HAS_PATCHES == 'true' && format('**Note: Custom patches were applied to the recovery source. Please check the "{0}" folder in the device tree used for the build, from which the patches were applied.**', inputs.PATCHES_FOLDER) || '' }}

          Device Tree Commit:
          [${{ env.SHORT_COMMIT_ID }}](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) - ${{ env.COMMIT_TITLE }} (${{ env.COMMIT_DATE }})
          
        prerelease: true
